[workspace]
resolver = "3"
members = ["crates/faulx", "crates/procedre", "crates/helpers", "crates/fuser"]

[workspace.package]
authors = ["martabal"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
homepage = "https://github.com/martabal/pstree-rs"
repository = "https://github.com/martabal/pstree-rs"

[workspace.dependencies]
clap = { version = "4.5.54", default-features = false, features = [
  "color",
  "derive",
  "std",
] }
humantime = { version = "2.3.0", default-features = false }
nix = { version = "0.30.1", default-features = false, features = [
  "feature",
  "signal",
  "user",
] }
orx-parallel = { version = "3.4.0", default-features = false }
rayon = { version = "1.11.0", default-features = false }
regex = { version = "1.11", default-features = false, features = [
  "std",
  "perf",
  "unicode-case",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = "symbols"

[workspace.lints.clippy]
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
